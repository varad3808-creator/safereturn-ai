<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile | SafeReturn</title>

<link
rel="stylesheet"
href="./style.css">

</head>

<body>

<!-- LOADER -->

<div
class="loading-screen"
id="loader">

<div class="loading-spinner"></div>

<div class="loading-text">

Loading SafeReturn...

</div>

</div>

<!-- GLOWS -->

<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>

<!-- NAVBAR -->

<nav>

<div class="logo">

Safe<span>Return</span>

</div>

<div class="nav-links">

<a
href="./index.html"
class="btn btn-glass">

Home

</a>

<a
href="./map.html"
class="btn btn-primary">

Emergency Map

</a>

</div>

</nav>

<!-- PROFILE -->

<section class="auth-container">

<div class="glass-card auth-card fade-up">

<div
style="
display:flex;
justify-content:center;
margin-bottom:30px;
">

<img
id="profileImage"
src="https://ui-avatars.com/api/?name=SafeReturn&background=2563eb&color=fff&size=220"
style="
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:5px solid rgba(255,255,255,0.1);
box-shadow:0 20px 50px rgba(0,0,0,0.35);
">

</div>

<h1
class="auth-title"
id="profileName">

Loading...

</h1>

<p
class="auth-sub"
id="profileEmail">

Loading...

</p>

<!-- STATS -->

<div
style="
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-top:35px;
margin-bottom:35px;
">

<div class="glass-card">

<h2
style="
font-size:42px;
margin-bottom:12px;
">

24

</h2>

<p>

Reports Viewed

</p>

</div>

<div class="glass-card">

<h2
style="
font-size:42px;
margin-bottom:12px;
">

8

</h2>

<p>

Emergency Actions

</p>

</div>

<div class="glass-card">

<h2
style="
font-size:42px;
margin-bottom:12px;
">

LIVE

</h2>

<p>

Realtime Alerts

</p>

</div>

</div>

<!-- ACCOUNT DETAILS -->

<div class="glass-card">

<h2
style="
margin-bottom:25px;
">

Account Information

</h2>

<p
style="
line-height:2;
color:#cbd5e1;
">

<b>Name:</b>

<span id="accountName">

Loading...

</span>

<br><br>

<b>Email:</b>

<span id="accountEmail">

Loading...

</span>

<br><br>

<b>User ID:</b>

<span id="accountUID">

Loading...

</span>

</p>

</div>

<br>

<!-- ACTIONS -->

<div
style="
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
">

<a
href="./report.html"
class="btn btn-danger">

Create Report

</a>

<a
href="./found.html"
class="btn btn-success">

Submit Found Report

</a>

<button
id="logoutBtn"
class="btn btn-warning">

Logout

</button>

</div>

</div>

</section>

<script type="module">

import {

auth

}

from "./firebase.js";

import {

onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

// =========================================
// ELEMENTS
// =========================================

const profileName =
document.getElementById("profileName");

const profileEmail =
document.getElementById("profileEmail");

const accountName =
document.getElementById("accountName");

const accountEmail =
document.getElementById("accountEmail");

const accountUID =
document.getElementById("accountUID");

const profileImage =
document.getElementById("profileImage");

// =========================================
// AUTH
// =========================================

onAuthStateChanged(

auth,

(user)=>{

if(user){

const name =

user.displayName ||

"SafeReturn User";

const email =

user.email ||

"No Email";

profileName.innerHTML =
name;

profileEmail.innerHTML =
email;

accountName.innerHTML =
name;

accountEmail.innerHTML =
email;

accountUID.innerHTML =
user.uid;

// =========================================
// PROFILE IMAGE
// =========================================

if(user.photoURL){

profileImage.src =
user.photoURL;

}
else{

profileImage.src =

`https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2563eb&color=fff&size=220`;

}

}
else{

window.location.href =
"./login.html";

}

}

);

// =========================================
// LOGOUT
// =========================================

document.getElementById("logoutBtn")

.addEventListener(

"click",

async()=>{

try{

await signOut(auth);

alert("Logged out");

window.location.href =
"./login.html";

}
catch(error){

alert(error.message);

}

}

);

// =========================================
// LOADER
// =========================================

window.addEventListener(

"load",

()=>{

setTimeout(()=>{

document.getElementById("loader")

.classList.add("hide");

},700);

}

);

</script>

</body>

</html>
