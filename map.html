<!-- GOOGLE MAPS -->

<script async
defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCqRs51B7r1SyPxLQyrU8-mAMisReF8Pms&callback=initMap">
</script>

<!-- MAP SCRIPT -->

<script type="module">

import { db }
from "./firebase.js?v=9999";

import {

collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

// =====================================
// MAP
// =====================================

let map;

// =====================================
// INIT MAP
// =====================================

window.initMap = async function(){

map = new google.maps.Map(

document.getElementById("map"),

{

zoom:5,

center:{

lat:20.5937,
lng:78.9629

},

styles:[

{
elementType:"geometry",
stylers:[{color:"#0f172a"}]
},

{
elementType:"labels.text.fill",
stylers:[{color:"#94a3b8"}]
},

{
featureType:"road",
elementType:"geometry",
stylers:[{color:"#1e293b"}]
},

{
featureType:"water",
elementType:"geometry",
stylers:[{color:"#020617"}]
}

]

}

);

loadPins();

};

// =====================================
// GET COORDS
// =====================================

async function getCoordinates(location){

try{

const response = await fetch(

`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(location)}&key=AIzaSyCqRs51B7r1SyPxLQyrU8-mAMisReF8Pms`

);

const data = await response.json();

if(data.results.length > 0){

return {

lat:data.results[0].geometry.location.lat,
lng:data.results[0].geometry.location.lng

};

}

}catch(error){

console.log(error);

}

return null;

}

// =====================================
// LOAD PINS
// =====================================

async function loadPins(){

const snapshot =
await getDocs(

collection(db,"reports")

);

snapshot.forEach(async(doc)=>{

const data =
doc.data();

// =====================================
// COORDS
// =====================================

let lat =
data.latitude;

let lng =
data.longitude;

// OLD REPORTS SUPPORT

if(!lat || !lng){

const coords =
await getCoordinates(data.location);

if(coords){

lat = coords.lat;
lng = coords.lng;

}else{

return;

}

}

// =====================================
// FOUND OR MISSING
// =====================================

const isFound =

data.type === "Found"

||

data.type === "found";

// =====================================
// MARKER
// =====================================

const marker =

new google.maps.Marker({

position:{

lat:Number(lat),
lng:Number(lng)

},

map,

title:data.name,

animation:
google.maps.Animation.DROP,

icon:{

path:
google.maps.SymbolPath.CIRCLE,

scale:12,

fillColor:

isFound

?

"#22c55e"

:

"#ef4444",

fillOpacity:1,

strokeWeight:3,

strokeColor:"#ffffff"

}

});

// =====================================
// INFO WINDOW
// =====================================

const infoWindow =

new google.maps.InfoWindow({

content:

`

<div style="
width:260px;
">

<img
src="${data.image}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:18px;
margin-bottom:15px;
">

<h2 style="
font-size:24px;
margin-bottom:10px;
color:#111827;
">

${data.name || "Unknown"}

</h2>

<p style="
font-size:15px;
line-height:1.6;
color:#374151;
">

<b>Type:</b>
${data.type}

<br><br>

<b>Location:</b>
${data.location}

<br><br>

<b>Pincode:</b>
${data.pincode || "N/A"}

</p>

<a
href="./details.html?id=${doc.id}"
style="
display:inline-block;
margin-top:15px;
padding:12px 18px;
border-radius:14px;
background:#2563eb;
color:white;
font-weight:700;
text-decoration:none;
">

View Details

</a>

</div>

`

});

// =====================================
// HOVER
// =====================================

marker.addListener(

"mouseover",

()=>{

infoWindow.open({

anchor:marker,
map

});

}

);

// =====================================
// CLICK
// =====================================

marker.addListener(

"click",

()=>{

infoWindow.open({

anchor:marker,
map

});

}

);

});

}

</script>

</body>
