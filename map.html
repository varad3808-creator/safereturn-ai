<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeReturn | Emergency Map</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        
        body { 
            background: #020b23; 
            min-height: 100vh; 
            color: white; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* PREMIUM NAVBAR */
        nav { 
            width: 100%; 
            height: 105px; 
            background: #020b23; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 70px; 
            z-index: 1000;
        }
        .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; color: white; }
        .logo i { color: #ef4444; font-size: 42px; }
        .logo h1 { font-size: 48px; font-weight: 900; }
        .logo span { color: #ef4444; }

        .btn-nav { padding: 12px 22px; font-size: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; text-decoration: none; border: none; }
        .btn-primary { background: #2563eb; color: white; }

        /* MAP CONTAINER */
        .map-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* LEGEND OVERLAY */
        .map-legend {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(2, 11, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .legend-item { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 15px; font-weight: bold; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
        .dot-red { background: #ef4444; }
        .dot-green { background: #16a34a; }

        /* INFO WINDOW FIX FOR DARK MODE */
        .gm-style .gm-style-iw-c { background-color: #07152f !important; color: white !important; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 12px !important; }
        .gm-style .gm-style-iw-d { overflow: hidden !important; }
        .gm-style .gm-style-iw-tc::after { background: #07152f !important; }
        .gm-ui-hover-effect { filter: invert(1); top: 5px !important; right: 5px !important; }
        
        .info-window-content { max-width: 200px; display: flex; flex-direction: column; gap: 6px; }
        .info-window-content h3 { font-size: 18px; color: white; font-weight: bold; margin-bottom: 2px; }
        .info-window-content p { font-size: 13px; color: #cbd5e1; line-height: 1.4; }
        .info-window-content img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 4px; }
        
        @media (max-width: 600px) {
            nav { padding: 0 20px; }
            .logo h1 { font-size: 28px; }
            .map-legend { bottom: 20px; left: 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="./index.html" class="logo">
            <i class="fa-solid fa-shield-heart"></i>
            <h1>Safe <span>Return</span></h1>
        </a>
        <a href="./index.html" class="btn-nav btn-primary">Back to Home</a>
    </nav>

    <div class="map-container">
        <div id="map"></div>
        <div class="map-legend">
            <div class="legend-item"><div class="legend-dot dot-red"></div> Missing Individuals</div>
            <div class="legend-item"><div class="legend-dot dot-green"></div> Missing passports</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwZZ3Vyb-qSpA5u_w4u9CW7y2kbdiDR94",
            authDomain: "safereturn-f6632.firebaseapp.com",
            projectId: "safereturn-f6632",
            storageBucket: "safereturn-f6632.firebasestorage.app",
            messagingSenderId: "753626237442",
            appId: "1:753626237442:web:f197134274a596777cf51b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let map;
        let geocoder;
        let activeMarkers = [];
        let infoWindow;

        // Dark mode configuration styles for Google Maps
        const mapStyles = [
            { elementType: "geometry", stylers: [{ color: "#02102f" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#020b23" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#8a9bb4" }] },
            { featureType: "water", elementType: "geometry", stylers: [{ color: "#010814" }] },
            { featureType: "road", elementType: "geometry", stylers: [{ color: "#0b2d73" }] },
            { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#1b4298" }] },
            { featureType: "poi", elementType: "geometry", stylers: [{ color: "#051a3f" }] },
            { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#cbd5e1" }] }
        ];

        window.initMap = function() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 20.5937, lng: 78.9629 }, // Default coordinates (India center)
                zoom: 5,
                styles: mapStyles,
                disableDefaultUI: true,
                zoomControl: true,
            });

            geocoder = new google.maps.Geocoder();
            infoWindow = new google.maps.InfoWindow();

            syncMapData();
        };

        function syncMapData() {
            onSnapshot(collection(db, "reports"), (snapshot) => {
                // Remove old markers from memory map overlay
                activeMarkers.forEach(marker => marker.setMap(null));
                activeMarkers = [];

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Exclude any records set to hidden/flagged status
                    if (data.flagged === true) return; 

                    const locationString = data.location || data.pincode;
                    if (!locationString) return;

                    // Forward text geocoding translation
                    geocoder.geocode({ address: locationString }, (results, status) => {
                        if (status === "OK") {
                            createMarker(results[0].geometry.location, data);
                        } else {
                            console.warn("Geocoding unresolvable: " + locationString);
                        }
                    });
                });
            });
        }

        function createMarker(position, data) {
            const type = (data.type || data.category || "missing").toLowerCase().trim();
            const isMissing = type === "missing";
            
            // Set Red and Green pins map references
            const pinIcon = isMissing 
                ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png" 
                : "https://maps.google.com/mapfiles/ms/icons/green-dot.png";

            const marker = new google.maps.Marker({
                map: map,
                position: position,
                icon: pinIcon,
                title: data.name || "Incident Report"
            });

            const img = data.imageUrl || data.image || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500";
            const statusLabel = isMissing ? "🚨 MISSING" : "✅ FOUND";
            const statusColor = isMissing ? "#ef4444" : "#16a34a";

            const contentString = `
                <div class="info-window-content">
                    <img src="${img}" alt="Incident Profile Picture">
                    <h3>${data.name || "Unknown"}</h3>
                    <p style="color: ${statusColor}; font-weight: bold; font-size: 14px;">${statusLabel}</p>
                    <p><b>Location Context:</b> ${data.location || "N/A"}</p>
                    <p><b>Contact Line:</b> ${data.contact || "N/A"}</p>
                </div>
            `;

            marker.addListener("click", () => {
                infoWindow.setContent(contentString);
                infoWindow.open({
                    anchor: marker,
                    map,
                    shouldFocus: false,
                });
            });

            activeMarkers.push(marker);
            window.presentationClickMarker = function(index){

if(activeMarkers[index]){

google.maps.event.trigger(
activeMarkers[index],
"click"
);

}

};

window.presentationMarkerCount = function(){

return activeMarkers.length;

};
        }
    </script>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCqRs51B7r1SyPxLQyrU8-mAMisReF8Pms&callback=initMap"></script>

</body>
</html>
