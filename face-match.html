<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Match | SafeReturn</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#020b2d;
            color:white;
        }

        .container{
            width:90%;
            max-width:1000px;
            margin:auto;
            margin-top:40px;
            background:#08153f;
            border-radius:25px;
            padding:40px;
        }

        h1{
            text-align:center;
            font-size:60px;
            margin-bottom:30px;
        }

        .upload-box{
            width:100%;
            height:420px;
            border-radius:25px;
            overflow:hidden;
            background:#111;
            margin-bottom:30px;
        }

        .upload-box img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        input{
            display:none;
        }

        .upload-btn{
            width:100%;
            padding:22px;
            border:none;
            border-radius:18px;
            font-size:28px;
            cursor:pointer;
            margin-bottom:20px;
            background:#2d6cff;
            color:white;
            font-weight:bold;
        }

        .scan-btn{
            width:100%;
            padding:24px;
            border:none;
            border-radius:18px;
            font-size:32px;
            cursor:pointer;
            background:#2d6cff;
            color:white;
            font-weight:bold;
        }

        #resultBox{
            margin-top:40px;
        }

        .match-card{
            background:#09153d;
            border-radius:25px;
            overflow:hidden;
            margin-bottom:40px;
            border:2px solid #2d6cff;
        }

        .match-card img{
            width:100%;
            height:450px;
            object-fit:cover;
        }

        .match-info{
            padding:30px;
        }

        .match-info h2{
            font-size:42px;
            margin-bottom:20px;
        }

        .match-info p{
            font-size:24px;
            margin-bottom:15px;
            line-height:1.5;
        }

        .match-badge{
            background:#1b3f9e;
            display:inline-block;
            padding:10px 20px;
            border-radius:30px;
            margin-bottom:20px;
            font-size:20px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>AI Face Match</h1>

        <div class="upload-box">
            <img id="previewImage" src="" alt="">
        </div>

        <input type="file" id="imageInput" accept="image/*">

        <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
            Upload Photo
        </button>

        <button class="scan-btn" onclick="scanFace()">
            🔍 Scan Database
        </button>

        <div id="resultBox"></div>

    </div>

    <script>

        const imageInput = document.getElementById("imageInput");
        const previewImage = document.getElementById("previewImage");

        imageInput.addEventListener("change", function(){

            const file = this.files[0];

            if(file){

                const reader = new FileReader();

                reader.onload = function(e){
                    previewImage.src = e.target.result;
                }

                reader.readAsDataURL(file);
            }
        });

        async function scanFace() {

            if (!previewImage.src) {
                alert("Upload image first");
                return;
            }

            const resultBox = document.getElementById("resultBox");

            resultBox.innerHTML = `
                <div style="font-size:40px;text-align:center;padding:40px;">
                    🔍 Scanning Database...
                </div>
            `;

            try {

                const response = await fetch("http://127.0.0.1:5000/match", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        image: previewImage.src
                    })
                });

                const data = await response.json();

                console.log(data);

                resultBox.innerHTML = "";

                if (!data.matches || data.matches.length === 0) {

                    resultBox.innerHTML = `
                        <div style="color:red;font-size:50px;text-align:center;padding:40px;font-weight:bold;">
                            No Matches Found
                        </div>
                    `;

                    return;
                }

                data.matches.forEach(match => {

                    resultBox.innerHTML += `

                    <div class="match-card">

                        <img src="${match.image}" alt="match">

                        <div class="match-info">

                            <div class="match-badge">
                                🧒 Missing Person
                            </div>

                            <h2>${match.name}</h2>

                            <p><strong>Location:</strong> ${match.location}</p>

                            <p><strong>Pincode:</strong> ${match.pincode}</p>

                            <p><strong>Contact:</strong> ${match.contact}</p>

                            <p>${match.description}</p>

                        </div>

                    </div>
                    `;
                });

            } catch (error) {

                console.log(error);

                resultBox.innerHTML = `
                    <div style="color:red;font-size:50px;text-align:center;padding:40px;font-weight:bold;">
                        AI Scan Failed
                    </div>
                `;
            }
        }

    </script>

</body>

</html>
