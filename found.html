<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Found Person | SafeReturn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
    body { background: radial-gradient(circle at top,#0f3d2a 0%,#021c10 45%,#088d0f 100%); min-height:100vh; color:white; }
    
    /* PREMIUM NAVBAR */
    nav { width:100%; height:105px; background:#01120a; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; padding:0 70px; }
    .logo { display:flex; align-items:center; gap:15px; }
    .logo i { color:#22c55e; font-size:42px; }
    .logo h1 { font-size:58px; font-weight:900; }
    .logo span { color:#22c55e; }
    .nav-links { display:flex; align-items:center; gap:45px; }
    .nav-links a { color:white; text-decoration:none; font-size:22px; font-weight:700; display:flex; align-items:center; gap:8px; }
    .nav-links a.active { color:#22c55e; }

    /* WORKSPACE CONTENT */
    .main { width:100%; display:flex; justify-content:center; padding:50px 20px; }
    .card { width:100%; max-width:900px; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.07); border-radius:35px; padding:50px; box-shadow: 0 0 50px rgba(0,0,0,0.5), 0 0 120px rgba(34,197,94,0.1); }
    .card h2 { font-size:42px; font-weight:900; margin-bottom:10px; }
    .card h2 span { color: #22c55e; }
    .subtitle { font-size:18px; opacity:0.6; margin-bottom:40px; }

    /* GRID FORM */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
    .full-width { grid-column: span 2; }
    .form-group { display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .form-group label { font-size: 16px; font-weight: 700; color: #94a3b8; }
    .form-control { width: 100%; height: 65px; background: #061f12; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 0 20px; color: white; font-size: 18px; outline: none; transition: 0.3s; }
    .form-control:focus { border-color: #22c55e; box-shadow: 0 0 15px rgba(34,197,94,0.2); }
    textarea.form-control { height: 140px; padding: 20px; resize: none; }

    /* HIGH-PERFORMANCE DROPZONE */
    .upload-box { width:100%; height:320px; border:2px dashed rgba(255,255,255,0.2); border-radius:25px; overflow:hidden; position:relative; cursor:pointer; background:#061f12; display:flex; align-items:center; justify-content:center; transition: 0.3s; }
    .upload-box:hover { border-color: #22c55e; background: #0a2e1b; }
    .upload-box img { width:100%; height:100%; object-fit:contain; background: #01120a; }
    .upload-placeholder { text-align:center; }
    .upload-placeholder i { font-size:60px; color:#22c55e; margin-bottom:15px; }
    .upload-placeholder h3 { font-size:24px; margin-bottom:8px; }
    .upload-placeholder p { font-size:16px; opacity:0.6; }

    /* SUBMIT BUTTON */
    .submit-btn { width:100%; height:85px; border:none; border-radius:22px; background:linear-gradient(135deg,#16a34a,#22c55e); color:white; font-size:28px; font-weight:800; cursor:pointer; transition:0.3s; box-shadow: 0 4px 20px rgba(34,197,94,0.3); display:flex; align-items:center; justify-content:center; gap:12px; }
    .submit-btn:hover { transform:scale(1.02); box-shadow: 0 6px 30px rgba(34,197,94,0.5); }
    .submit-btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

    @media(max-width:900px){ 
        .form-grid { grid-template-columns: 1fr; } 
        .full-width { grid-column: span 1; } 
        nav { padding: 0 20px; flex-direction: column; height: auto; padding-top: 20px; padding-bottom:20px; gap: 15px; } 
        .card { padding: 25px; } 
        .logo h1 { font-size:38px; }
        .nav-links { gap:20px; }
        .nav-links a { font-size:17px; }
    }
</style>
</head>
<body>

<nav>
    <div class="logo">
        <i class="fa-solid fa-shield-heart"></i>
        <h1>Safe <span>Return</span></h1>
    </div>
    <div class="nav-links">
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="report.html"><i class="fa-solid fa-file-invoice"></i> Missing Report</a>
        <a href="found.html" class="active"><i class="fa-solid fa-hand-holding-heart"></i> Found Report</a>
        <a href="face-match.html"><i class="fa-solid fa-robot"></i> AI Face Match</a>
    </div>
</nav>

<div class="main">
    <div class="card">
        <h2>File Found <span>Report</span></h2>
        <p class="subtitle">Publish spotted or recovered individual details onto the system tracking grids instantly.</p>

        <form id="foundReportForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name / Description Identifier</label>
                    <input type="text" id="caseName" class="form-control" placeholder="e.g. Unknown (Child) or John Doe" required>
                </div>
                <div class="form-group">
    <label>Gender</label>

    <select
        id="gender"
        class="form-control">

        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
        <option>Unknown</option>

    </select>
</div>

<div class="form-group">
    <label>Estimated Age</label>

    <input
        type="number"
        id="age"
        class="form-control"
        placeholder="Age in years">
</div>
                <div class="form-group">
                    <label>Sighting Location</label>
                    <input type="text" id="caseLocation" class="form-control" placeholder="e.g. Central Park, NY" required>
                </div>
                <div class="form-group">
                    <label>Area Pincode</label>
                    <input type="text" id="casePincode" class="form-control" placeholder="10024" required>
                </div>
                <div class="form-group">
                    <label>Emergency Contact</label>
                    <input type="tel" id="caseContact" class="form-control" placeholder="+1 (555) 019-2834" required>
                </div>
                <div class="form-group full-width">
                    <label>Detailed Status & Safety Identifiers</label>
                    <textarea id="caseDescription" class="form-control" placeholder="Specify current condition, color of clothes worn, safe with security, etc..." required></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label>Profile Image Assets</label>
                    <input type="file" id="imageFileInput" accept="image/*" hidden>
                    <div class="upload-box" onclick="document.getElementById('imageFileInput').click()">
                        <img id="imagePreview" style="display:none;">
                        <div class="upload-placeholder" id="placeholderUI">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <h3>Select Master Image Profile</h3>
                            <p>Clear, direct facial lighting is highly recommended</p>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submissionTriggerBtn">
                <i class="fa-solid fa-paper-plane"></i> Broadcast Safe Sighting Log
            </button>
        </form>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
    getAuth
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBwZZ3Vyb-qSpA5u_w4u9CW7y2kbdiDR94",
        authDomain: "safereturn-f6632.firebaseapp.com",
        projectId: "safereturn-f6632",
        storageBucket: "safereturn-f6632.firebasestorage.app",
        messagingSenderId: "753626237442",
        appId: "1:753626237442:web:f197134274a596777cf51b",
        measurementId: "G-9GDWF67F4R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const imageFileInput = document.getElementById("imageFileInput");
    const imagePreview = document.getElementById("imagePreview");
    const placeholderUI = document.getElementById("placeholderUI");
    const reportForm = document.getElementById("foundReportForm");
    const submitBtn = document.getElementById("submissionTriggerBtn");

    let verifiedImageFile = null;
    async function getBuffaloEmbedding(file){

    const formData = new FormData();

    formData.append("file", file);

    const response = await fetch(
        "http://127.0.0.1:8000/extract",
        {
            method:"POST",
            body:formData
        }
    );

    return await response.json();

}

    imageFileInput.addEventListener("change", () => {
        const file = imageFileInput.files[0];
        if(file) {
            verifiedImageFile = file;
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.style.display = "block";
            placeholderUI.style.display = "none";
        }
    });

    reportForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        if(!verifiedImageFile) {
            alert("Please include a sighting photo asset for verification.");
            return;
        }

        submitBtn.disabled = true;
        const buffaloFace =
await getBuffaloEmbedding(
    verifiedImageFile
);
if(!buffaloFace.success){

    throw new Error(
        "No face detected in uploaded image."
    );

}
// ==========================
// CHECK FOR DUPLICATE REPORTS
// ==========================

const reportsSnapshot =
await getDocs(
    collection(db,"reports")
);

let duplicate = null;

let highestSimilarity = 0;
for (const report of reportsSnapshot.docs) {

    const data = report.data();

    if (!data.embedding)
        continue;

    let dot = 0;
    let normA = 0;
    let normB = 0;

    for (let i = 0; i < buffaloFace.embedding.length; i++) {

        dot +=
            buffaloFace.embedding[i] *
            data.embedding[i];

        normA +=
            buffaloFace.embedding[i] *
            buffaloFace.embedding[i];

        normB +=
            data.embedding[i] *
            data.embedding[i];

    }

    const similarity =
        dot /
        (
            Math.sqrt(normA) *
            Math.sqrt(normB)
        );

    if (similarity > highestSimilarity) {

        highestSimilarity = similarity;

        duplicate = data;

    }

}
if (highestSimilarity >= 0.95) {

    const proceed = confirm(

`⚠️ POSSIBLE DUPLICATE FOUND

Name : ${duplicate.name}

Similarity :
${(highestSimilarity*100).toFixed(1)}%

Press OK to continue.

Press Cancel to stop.`

    );

    if (!proceed) {

        submitBtn.disabled = false;

        submitBtn.innerHTML =
        `<i class="fa-solid fa-paper-plane"></i> Submit`;

        return;

    }

}

if(!buffaloFace.success){

    throw new Error(
        "No face detected."
    );

}
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading to Cloudinary Storage...`;

        try {
            // 1. Post to Cloudinary Serverless REST API
            const cloudinaryPayload = new FormData();
            cloudinaryPayload.append("file", verifiedImageFile);
            cloudinaryPayload.append("upload_preset", "safe_return_upload");

            const cloudinaryResponse = await fetch("https://api.cloudinary.com/v1_1/dtqvfvckj/image/upload", {
                method: "POST",
                body: cloudinaryPayload
            });

            const secureCloudinaryData = await cloudinaryResponse.json();
            
            if(!secureCloudinaryData.secure_url) {
                throw new Error("Cloudinary file generation dropped.");
            }

            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Writing Record into Firestore Matrix...`;
const user = auth.currentUser;

if (!user) {

    alert("Please login first.");

    return;

}
            // 2. Commit Document cleanly into Firestore "reports" collection as 'found'
await addDoc(collection(db, "reports"), {

    // ==========================
    // USER OWNERSHIP
    // ==========================

    createdBy: user.uid,

    createdByName: user.displayName || "",

    createdByEmail: user.email,

    createdAt: new Date(),

    status: "Active",

    // ==========================
    // REPORT DATA
    // ==========================

    name: document.getElementById("caseName").value,

    gender: document.getElementById("gender").value,

    estimatedAge: parseInt(
        document.getElementById("age").value
    ) || null,

    location: document.getElementById("caseLocation").value,

    pincode: document.getElementById("casePincode").value,

    contact: document.getElementById("caseContact").value,

    reward: parseInt(
        document.getElementById("caseReward").value
    ) || 0,

    description: document.getElementById("caseDescription").value,

    imageUrl: secureCloudinaryData.secure_url,

    embedding: buffaloFace.embedding,

type: "found",

category: "found",

    timestamp: new Date().toISOString()

});

            alert("Goated! Sighting listed into Firestore and image secured on Cloudinary.");
            reportForm.reset();
            imagePreview.style.display = "none";
            placeholderUI.style.display = "block";
            verifiedImageFile = null;

        } catch (err) {
            console.error(err);
            alert("Pipeline Delivery Error: " + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Broadcast Safe Sighting Log`;
        }
    });
</script>

</body>
</html>
