<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Report Found | SafeReturn</title>

<link
rel="stylesheet"
href="./style.css?v=9999">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet">

</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>

<nav>

<div class="logo">

<i class="fa-solid fa-shield-heart"></i>

Safe<span>Return</span>

</div>

<div class="nav-links">

<a href="./index.html" class="nav-item">

<i class="fa-solid fa-house"></i>

Home

</a>

<a href="./found.html" class="nav-item active-nav">

<i class="fa-solid fa-circle-check"></i>

Report Found

</a>

</div>

</nav>

<section class="report-page">

<div class="report-container">

<div class="report-icon found-icon">

<i class="fa-solid fa-circle-check"></i>

</div>

<h1>

Report Found Person

</h1>

<p>

Submit details of found individuals or pets to help reconnect families faster.

</p>

<form id="foundForm">

<div class="input-group">

<label>Name / Identification</label>

<div class="input-box">

<i class="fa-regular fa-user"></i>

<input
type="text"
id="name"
placeholder="Enter found person's name"
required>

</div>

</div>

<div class="input-group">

<label>Category</label>

<div class="input-box">

<i class="fa-solid fa-layer-group"></i>

<select id="category">

<option value="found">

Found Person

</option>

<option value="elderly">

Found Elderly

</option>

<option value="pet">

Found Pet

</option>

</select>

</div>

</div>

<div class="input-group">

<label>Found Location</label>

<div class="input-box">

<i class="fa-solid fa-location-dot"></i>

<input
type="text"
id="location"
placeholder="Enter found location"
required>

</div>

</div>

<div class="input-group">

<label>Pincode</label>

<div class="input-box">

<i class="fa-solid fa-map-pin"></i>

<input
type="number"
id="pincode"
placeholder="Enter area pincode"
required>

</div>

</div>

<div class="input-group">

<label>Emergency Contact</label>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
id="contact"
placeholder="Enter contact number"
required>

</div>

</div>

<div class="input-group">

<label>Description</label>

<div class="textarea-box">

<textarea
id="description"
placeholder="Enter complete found details"
required>

</textarea>

</div>

</div>

<div class="input-group">

<label>Upload Image</label>

<div class="upload-buttons">

<label class="upload-btn">

<i class="fa-solid fa-camera"></i>

Take Photo

<input
type="file"
id="cameraInput"
accept="image/*"
capture="environment"
hidden>

</label>

<label class="upload-btn">

<i class="fa-regular fa-image"></i>

Choose File

<input
type="file"
id="galleryInput"
accept="image/*"
hidden>

</label>

</div>

</div>

<img
id="preview"
class="image-preview">

<button
type="submit"
class="submit-btn found-btn">

Submit Found Report

</button>

</form>

<div id="status"></div>

<div id="resultBox"></div>

</div>

</section>

<script type="module">

import { db }
from "./firebase.js?v=9999";

import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const CLOUD_NAME =
"dywa9bu7c";

const UPLOAD_PRESET =
"safereturn_uploads";

const preview =
document.getElementById("preview");

const cameraInput =
document.getElementById("cameraInput");

const galleryInput =
document.getElementById("galleryInput");

function previewImage(input){

input.addEventListener(

"change",

(e)=>{

const file =
e.target.files[0];

if(file){

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

}

}

);

}

previewImage(cameraInput);
previewImage(galleryInput);

document.getElementById(

"foundForm"

)

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

const status =
document.getElementById("status");

const resultBox =
document.getElementById("resultBox");

status.innerHTML =
"Uploading report...";

const file =

cameraInput.files[0]

||

galleryInput.files[0];

if(!file){

status.innerHTML =
"Please upload image";

return;

}

try{

const formData =
new FormData();

formData.append("file",file);

formData.append(
"upload_preset",
UPLOAD_PRESET
);

const upload =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,

{

method:"POST",

body:formData

}

);

const imageData =
await upload.json();

status.innerHTML =
"🔍 AI scanning database...";

const aiResponse =
await fetch(

"http://127.0.0.1:5000/match",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

image:imageData.secure_url

})

}

);

const aiData =
await aiResponse.json();

resultBox.innerHTML = "";

if(aiData.matches.length > 0){

resultBox.innerHTML += `

<h1 style="
text-align:center;
font-size:50px;
margin-top:50px;
margin-bottom:30px;
color:#22c55e;
">

Possible Matches Found

</h1>

`;

aiData.matches.forEach(match=>{

resultBox.innerHTML += `

<div class="match-card">

<img src="${match.image}">

<div class="match-info">

<div class="match-badge">

🧒 Missing Match

</div>

<h2>${match.name}</h2>

<p>
<strong>Location:</strong>
${match.location}
</p>

<p>
<strong>Pincode:</strong>
${match.pincode}
</p>

<p>
<strong>Contact:</strong>
${match.contact}
</p>

<p>
${match.description}
</p>

</div>

</div>

`;

});

}else{

resultBox.innerHTML = `

<div style="
text-align:center;
font-size:40px;
font-weight:bold;
color:red;
margin-top:40px;
">

No Matches Found

</div>

`;

}

await addDoc(

collection(db,"reports"),

{

name:
document.getElementById("name").value,

category:
document.getElementById("category").value,

location:
document.getElementById("location").value,

pincode:
document.getElementById("pincode").value,

contact:
document.getElementById("contact").value,

description:
document.getElementById("description").value,

image:
imageData.secure_url,

type:"Found",

status:"active",

createdAt:
serverTimestamp()

}

);

status.innerHTML =
"✅ Found report submitted";

document.getElementById("foundForm").reset();

preview.style.display =
"none";

}
catch(error){

console.log(error);

status.innerHTML =
"❌ Upload failed";

}

}

);

</script>
