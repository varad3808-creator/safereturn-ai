<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SafeReturn | People Admin</title>

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
radial-gradient(
circle at top,
#0b2d73 0%,
#02102f 45%,
#010814 100%
);

color:white;
min-height:100vh;

}

/* ========================= */
/* NAVBAR */
/* ========================= */

nav{

height:90px;

background:#020b23;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 40px;

border-bottom:
1px solid rgba(255,255,255,.08);

}

.logo{

display:flex;
align-items:center;
gap:14px;

text-decoration:none;
color:white;

}

.logo i{

font-size:40px;
color:#ef4444;

}

.logo h1{

font-size:42px;
font-weight:900;

}

.logo span{

color:#ef4444;

}

.nav-right{

display:flex;
gap:15px;

}

.nav-btn{

padding:14px 24px;

border-radius:14px;

text-decoration:none;

font-weight:800;

display:flex;
align-items:center;
gap:10px;

transition:.3s;

color:white;

}

.nav-btn:hover{

transform:translateY(-3px);

}

.people-btn{

background:
linear-gradient(
135deg,
#2563eb,
#3b82f6
);

}

.passport-btn{

background:
linear-gradient(
135deg,
#7c3aed,
#06b6d4
);

}

.home-btn{

background:#07152f;

}

/* ========================= */
/* CONTAINER */
/* ========================= */

.container{

padding:40px;

}

.page-title{

margin-bottom:35px;

}

.page-title h2{

font-size:52px;
font-weight:900;

margin-bottom:12px;

}

.page-title p{

color:#cbd5e1;
font-size:18px;

}

/* ========================= */
/* ANALYTICS */
/* ========================= */

.analytics{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:25px;

margin-bottom:35px;

}

.analytics-box{

height:220px;

border-radius:30px;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

box-shadow:
0 20px 50px rgba(0,0,0,.35);

}

.analytics-box i{

font-size:50px;

margin-bottom:20px;

}

.analytics-box h2{

font-size:76px;
font-weight:900;

margin-bottom:10px;

}

.analytics-box p{

font-size:18px;
font-weight:900;

text-transform:uppercase;

}

.missing-box{

background:
linear-gradient(
135deg,
#7f1d1d,
#dc2626
);

}

.found-box{

background:
linear-gradient(
135deg,
#14532d,
#16a34a
);

}

/* ========================= */
/* SEARCH BAR */
/* ========================= */

.search-row{

display:flex;
gap:20px;

margin-bottom:25px;

flex-wrap:wrap;

}

.search-row input,
.search-row select{

flex:1;

padding:15px;

border-radius:14px;

border:none;

background:#0b1d43;

color:white;

font-size:16px;

}

/* ========================= */
/* TABLE */
/* ========================= */

.table-container{

background:
rgba(7,21,47,.55);

border-radius:25px;

padding:20px;

overflow:auto;

box-shadow:
0 20px 45px rgba(0,0,0,.35);

}

table{

width:100%;
border-collapse:collapse;

min-width:1100px;

}

th,td{

padding:20px;

text-align:left;

border-bottom:
1px solid rgba(255,255,255,.08);

}

th{

font-size:14px;

color:#94a3b8;

text-transform:uppercase;

letter-spacing:1px;

}

.admin-img{

width:85px;
height:85px;

object-fit:cover;

border-radius:18px;

border:
2px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;

}

.admin-img:hover{

transform:scale(1.05);

}

.badge{

padding:10px 15px;

border-radius:12px;

font-size:12px;

font-weight:900;

display:inline-block;

}

.missing{

background:#dc2626;

}

.found{

background:#16a34a;

}

.btn{

padding:11px 15px;

border:none;

border-radius:12px;

font-weight:900;

cursor:pointer;

margin:3px;

}

.flag-btn{

background:#facc15;

color:black;

}

.delete-btn{

background:#dc2626;

color:white;

}

/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:900px){

nav{

flex-direction:column;

height:auto;

padding:20px;

gap:20px;

}

.nav-right{

flex-wrap:wrap;
justify-content:center;

}

.analytics{

grid-template-columns:1fr;

}

.container{

padding:20px;

}

.page-title h2{

font-size:36px;

}

}

</style>

</head>

<body>

<nav>

<a
href="./index.html"
class="logo">

<i class="fa-solid fa-shield-heart"></i>

<h1>

Safe <span>Return</span>

</h1>

</a>

<div class="nav-right">

<a
href="./admin.html"
class="nav-btn people-btn">

<i class="fa-solid fa-users"></i>

People

</a>

<a
href="./passport-admin.html"
class="nav-btn passport-btn">

<i class="fa-solid fa-passport"></i>

Passports

</a>

<a
href="./index.html"
class="nav-btn home-btn">

<i class="fa-solid fa-house"></i>

Home

</a>

</div>

</nav>

<div class="container">

<div class="page-title">

<h2>

👥 People Reports Admin

</h2>

<p>

Manage missing and found reports securely

</p>

</div>

<div class="analytics">

<div class="analytics-box missing-box">

<i class="fa-solid fa-triangle-exclamation"></i>

<h2 id="missingCount">

0

</h2>

<p>

Missing People

</p>

</div>

<div class="analytics-box found-box">

<i class="fa-solid fa-circle-check"></i>

<h2 id="foundCount">

0

</h2>

<p>

Found People

</p>

</div>

</div>

<div class="search-row">

<input
type="text"
id="searchBox"
placeholder="🔍 Search by name or location...">

<select id="filterType">

<option value="all">

All Reports

</option>

<option value="missing">

Missing

</option>

<option value="found">

Found

</option>

</select>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Image</th>

<th>Name</th>

<th>Location</th>

<th>Status</th>

<th>Controls</th>

</tr>

</thead>

<tbody id="body"></tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getFirestore,
collection,
onSnapshot,
doc,
deleteDoc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

/* =====================================
   FIREBASE
===================================== */

const app = initializeApp({

apiKey:"AIzaSyBwZZ3Vyb-qSpA5u_w4u9CW7y2kbdiDR94",

authDomain:"safereturn-f6632.firebaseapp.com",

projectId:"safereturn-f6632"

});

const db = getFirestore(app);

const auth = getAuth(app);

/* =====================================
   ELEMENTS
===================================== */

const body =
document.getElementById("body");

const searchBox =
document.getElementById("searchBox");

const filterType =
document.getElementById("filterType");

const missingCount =
document.getElementById("missingCount");

const foundCount =
document.getElementById("foundCount");

const lightbox =
GLightbox({

selector:".glightbox"

});

/* =====================================
   DATA
===================================== */

let allReports = [];

/* =====================================
   ADMIN LOGIN
===================================== */

onAuthStateChanged(auth,(user)=>{

console.log("Logged in:",user?.email);

if(!user){

alert("Please login first.");

window.location.href="./login.html";

return;

}

if(user.email !== "varad3808@gmail.com"){

alert("Access Denied");

window.location.href="./index.html";

return;

}

console.log("Admin Verified");

/* =====================================
   FIRESTORE LISTENER
===================================== */

onSnapshot(

collection(db,"reports"),

(snapshot)=>{

allReports=[];

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

allReports.push({

id:docSnap.id,

...data

});

});

renderTable();

}

);

});
/* =====================================
   RENDER TABLE
===================================== */

function renderTable(){

body.innerHTML="";

let missing=0;
let found=0;

const search =
searchBox.value.toLowerCase().trim();

const filter =
filterType.value;

allReports.forEach((report)=>{

const type =
(report.type || "")
.toLowerCase()
.trim();

/* Skip passport reports */

if(
type==="lost-passport" ||
type==="found-passport"
){
return;
}

/* Search */

const matchesSearch=

(report.name||"")
.toLowerCase()
.includes(search)

||

(report.location||"")
.toLowerCase()
.includes(search);

/* Filter */

const matchesFilter=

filter==="all"

||

type===filter;

if(
!matchesSearch ||
!matchesFilter
){
return;
}

/* Counters */

if(type==="missing"){

missing++;

}

if(type==="found"){

found++;

}

/* Image */

const img=

report.imageUrl ||

"https://via.placeholder.com/120";

/* Status */

const badge=

type==="missing"

?

'<span class="badge missing">🚨 MISSING PERSON</span>'

:

'<span class="badge found">✅ FOUND PERSON</span>';

/* Row */

body.innerHTML +=

`

<tr>

<td>

<a
href="${img}"
class="glightbox">

<img
src="${img}"
class="admin-img">

</a>

</td>

<td>

<b>

${report.name || "Unknown"}

</b>

</td>

<td>

${report.location || "-"}

</td>

<td>

${badge}

</td>

<td>

<button

class="btn flag-btn"

onclick="toggleFlag('${report.id}', ${!!report.flagged})"

>

${report.flagged ? "Unflag" : "Flag"}

</button>

<button

class="btn delete-btn"

onclick="deleteRow('${report.id}')"

>

Delete

</button>

</td>

</tr>

`;

});

/* Analytics */

missingCount.innerText=missing;

foundCount.innerText=found;

/* Reload Lightbox */

lightbox.reload();

}

/* =====================================
   SEARCH
===================================== */

searchBox.addEventListener(

"input",

renderTable

);

/* =====================================
   FILTER
===================================== */

filterType.addEventListener(

"change",

renderTable

);
/* =====================================
   FLAG REPORT
===================================== */

window.toggleFlag = async (id, current) => {

    try {

        await updateDoc(
            doc(db, "reports", id),
            {
                flagged: !current
            }
        );

    } catch (err) {

        console.error(err);
        alert("Unable to update flag.");

    }

};

/* =====================================
   DELETE REPORT
===================================== */

window.deleteRow = async (id) => {

    const ok = confirm(
        "Are you sure you want to permanently delete this report?"
    );

    if (!ok) return;

    try {

        await deleteDoc(
            doc(db, "reports", id)
        );

        alert("Report deleted successfully.");

    } catch (err) {

        console.error(err);
        alert("Unable to delete report.");

    }

};

</script>

</body>
</html>
