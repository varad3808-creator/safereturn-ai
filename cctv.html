<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafeReturn | Command Matrix</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #020714; --panel: #071125; --accent: #7c3aed; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        nav { background: var(--panel); padding: 20px 40px; display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b; }
        .logo { font-weight: 800; font-size: 20px; color: white; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-weight: 600; }
        .container { max-width: 600px; margin: 60px auto; background: var(--panel); padding: 40px; border-radius: 20px; border: 1px solid #1e293b; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 10px; background: var(--bg); border: 1px solid #1e293b; color: white; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; padding: 15px; border-radius: 10px; border: none; width: 100%; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">SafeReturn <span style="color:#7c3aed;">MATRIX</span></div>
        <div class="nav-links">
            <a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        </div>
    </nav>
    <div class="container">
        <h1>Surveillance Upload</h1>
        <form id="cctvForm">
            <input type="text" id="loc" placeholder="Location Name" required>
            <input type="number" id="pin" placeholder="Area Pincode" required>
            <input type="file" id="fileInput" accept="video/*,image/*" required>
            <button type="submit" class="btn" id="submitBtn">Initialize Upload</button>
        </form>
    </div>
    </body>
</html>
