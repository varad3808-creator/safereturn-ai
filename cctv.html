<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CCTV Upload Portal</title>

<link
rel="stylesheet"
href="./style.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet">

</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<nav>

<div class="logo">

<i class="fa-solid fa-video"></i>

Safe<span>Return</span>

</div>

</nav>

<section class="auth-page">

<div class="auth-box">

<div class="auth-icon">

<i class="fa-solid fa-camera"></i>

</div>

<h1>

CCTV Upload Portal

</h1>

<p>

Upload CCTV evidence to assist emergency rescue operations.

</p>

<form id="cctvForm">

<label>Location</label>

<div class="modern-input">

<i class="fa-solid fa-location-dot"></i>

<input
type="text"
id="location"
placeholder="CCTV location"
required>

</div>

<label>Description</label>

<div class="modern-input">

<i class="fa-regular fa-note-sticky"></i>

<input
type="text"
id="description"
placeholder="Describe footage"
required>

</div>

<label>Upload CCTV Image</label>

<div class="modern-input">

<i class="fa-regular fa-image"></i>

<input
type="file"
id="image"
accept="image/*"
required>

</div>

<img
id="preview"
style="
width:100%;
border-radius:20px;
margin-bottom:30px;
display:none;
">

<button
type="submit"
class="modern-btn">

Upload CCTV Evidence

</button>

</form>

</div>

</section>

<script type="module">

import {

db

}

from "./firebase.js";

import {

collection,
addDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

// =========================================
// CLOUDINARY
// =========================================

const CLOUD_NAME =
"dywa9bu7c";

const UPLOAD_PRESET =
"safereturn_uploads";

// =========================================
// UPLOAD
// =========================================

async function uploadToCloudinary(file){

const formData = new FormData();

formData.append(

"file",
file

);

formData.append(

"upload_preset",
UPLOAD_PRESET

);

const response = await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,

{

method:"POST",

body:formData

}

);

const data =
await response.json();

return data.secure_url;

}

// =========================================
// PREVIEW
// =========================================

document.getElementById("image")

.addEventListener(

"change",

(e)=>{

const file =
e.target.files[0];

if(file){

const preview =
document.getElementById("preview");

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

}

}

);

// =========================================
// SUBMIT
// =========================================

document.getElementById("cctvForm")

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

try{

const file =

document.getElementById("image")

.files[0];

const imageUrl =

await uploadToCloudinary(file);

await addDoc(

collection(db,"cctv"),

{

location:
document.getElementById("location").value,

description:
document.getElementById("description").value,

image:
imageUrl,

createdAt:
serverTimestamp()

}

);

alert(

"CCTV evidence uploaded"

);

window.location.href =
"./index.html";

}
catch(error){

alert(error.message);

}

}

);

</script>

</body>

</html>
