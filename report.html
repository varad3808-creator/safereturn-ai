<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Report Missing | SafeReturn</title>

<link
rel="stylesheet"
href="./style.css?v=9999">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet">

</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>

<nav>

<div class="logo">

<i class="fa-solid fa-shield-heart"></i>

Safe<span>Return</span>

</div>

<div class="nav-links">

<a href="./index.html" class="nav-item">

<i class="fa-solid fa-house"></i>

Home

</a>

<a href="./report.html" class="nav-item active-nav">

<i class="fa-solid fa-triangle-exclamation"></i>

Report Missing

</a>

</div>

</nav>

<section class="report-page">

<div class="report-container">

<div class="report-icon">

<i class="fa-solid fa-triangle-exclamation"></i>

</div>

<h1>

Report Missing Person

</h1>

<p>

Submit emergency details to help reunite families faster.

</p>

<form id="reportForm">

<div class="input-group">

<label>Full Name</label>

<div class="input-box">

<i class="fa-regular fa-user"></i>

<input
type="text"
id="name"
placeholder="Enter full name"
required>

</div>

</div>

<div class="input-group">

<label>Category</label>

<div class="input-box">

<i class="fa-solid fa-layer-group"></i>

<select id="category">

<option value="missing">

Missing Person

</option>

<option value="elderly">

Missing Elderly

</option>

<option value="pet">

Lost Pet

</option>

</select>

</div>

</div>

<div class="input-group">

<label>Last Seen Location</label>

<div class="input-box">

<i class="fa-solid fa-location-dot"></i>

<input
type="text"
id="location"
placeholder="Enter location"
required>

</div>

</div>

<div class="input-group">

<label>Pincode</label>

<div class="input-box">

<i class="fa-solid fa-map-pin"></i>

<input
type="number"
id="pincode"
placeholder="Enter area pincode"
required>

</div>

</div>

<div class="input-group">

<label>Emergency Contact</label>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
id="contact"
placeholder="Enter contact number"
required>

</div>

</div>

<div class="input-group">

<label>Description</label>

<div class="textarea-box">

<textarea
id="description"
placeholder="Enter full emergency details"
required>

</textarea>

</div>

</div>

<div class="input-group">

<label>Upload Image</label>

<div class="upload-buttons">

<label class="upload-btn">

<i class="fa-solid fa-camera"></i>

Take Photo

<input
type="file"
id="cameraInput"
accept="image/*"
capture="environment"
hidden>

</label>

<label class="upload-btn">

<i class="fa-regular fa-image"></i>

Choose File

<input
type="file"
id="galleryInput"
accept="image/*"
hidden>

</label>

</div>

</div>

<img
id="preview"
class="image-preview">

<button
type="submit"
class="submit-btn">

Submit Missing Report

</button>

</form>

<div id="status"></div>

</div>

</section>

<script type="module">

import { db }
from "./firebase.js?v=9999";

import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const CLOUD_NAME =
"dywa9bu7c";

const UPLOAD_PRESET =
"safereturn_uploads";

const preview =
document.getElementById("preview");

const cameraInput =
document.getElementById("cameraInput");

const galleryInput =
document.getElementById("galleryInput");

function previewImage(input){

input.addEventListener(

"change",

(e)=>{

const file =
e.target.files[0];

if(file){

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

}

}

);

}

previewImage(cameraInput);
previewImage(galleryInput);

document.getElementById(

"reportForm"

)

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

const status =
document.getElementById("status");

status.innerHTML =
"Uploading report...";

const file =

cameraInput.files[0]

||

galleryInput.files[0];

if(!file){

status.innerHTML =
"Please upload image";

return;

}

try{

const formData =
new FormData();

formData.append("file",file);

formData.append(
"upload_preset",
UPLOAD_PRESET
);

const upload =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,

{

method:"POST",

body:formData

}

);

const imageData =
await upload.json();

await addDoc(

collection(db,"reports"),

{

name:
document.getElementById("name").value,

category:
document.getElementById("category").value,

location:
document.getElementById("location").value,

pincode:
document.getElementById("pincode").value,

contact:
document.getElementById("contact").value,

description:
document.getElementById("description").value,

image:
imageData.secure_url,

type:"Missing",

status:"active",

createdAt:
serverTimestamp()

}

);

status.innerHTML =
"✅ Missing report submitted";

document.getElementById("reportForm").reset();

preview.style.display =
"none";

}
catch(error){

console.log(error);

status.innerHTML =
"❌ Upload failed";

}

}

);

</script>

<style>

.report-page{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:140px 20px 80px;

}

.report-container{

width:100%;
max-width:560px;

padding:55px;

border-radius:38px;

background:
rgba(3,7,18,0.78);

backdrop-filter:blur(20px);

border:
1px solid rgba(59,130,246,0.12);

box-shadow:
0 0 80px rgba(37,99,235,0.15);

}

.report-icon{

width:120px;
height:120px;

margin:auto auto 30px;

border-radius:35px;

display:flex;
justify-content:center;
align-items:center;

font-size:55px;

background:
linear-gradient(
135deg,
#2563eb,
#3b82f6
);

box-shadow:
0 0 45px rgba(37,99,235,0.45);

}

.report-container h1{

font-size:76px;

line-height:0.95;

font-weight:900;

text-align:center;

margin-bottom:20px;

}

.report-container p{

text-align:center;

font-size:20px;

line-height:1.7;

color:#cbd5e1;

margin-bottom:45px;

}

.input-group{

margin-bottom:26px;

}

.input-group label{

display:block;

margin-bottom:12px;

font-weight:700;

}

.input-box{

height:74px;

display:flex;

align-items:center;

gap:15px;

padding:0 22px;

border-radius:24px;

background:
rgba(255,255,255,0.04);

border:
1px solid rgba(255,255,255,0.06);

}

.input-box i{

font-size:20px;

color:#93c5fd;

}

.input-box input,
.input-box select{

width:100%;
height:100%;

background:none;

border:none;

outline:none;

font-size:18px;

color:white;

}

.textarea-box{

background:
rgba(255,255,255,0.04);

border:
1px solid rgba(255,255,255,0.06);

border-radius:24px;

padding:20px;

}

.textarea-box textarea{

width:100%;

height:150px;

background:none;

border:none;

outline:none;

resize:none;

font-size:17px;

color:white;

font-family:inherit;

}

.upload-buttons{

display:flex;

gap:18px;

}

.upload-btn{

flex:1;

height:72px;

border-radius:22px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

display:flex;

justify-content:center;

align-items:center;

gap:12px;

font-weight:700;

cursor:pointer;

transition:0.3s;

}

.upload-btn:hover{

background:
rgba(59,130,246,0.15);

transform:translateY(-2px);

}

.image-preview{

width:100%;

height:340px;

object-fit:cover;

margin-bottom:25px;

2px solid rgba(59,130,246,0.25);

}

.submit-btn{

width:100%;

height:78px;

border:none;

border-radius:26px;

font-size:22px;

font-weight:800;

color:white;

cursor:pointer;

background:
linear-gradient(
135deg,
#ef4444,
#dc2626
);

transition:0.3s;

}

.submit-btn:hover{

transform:translateY(-3px);

box-shadow:
0 0 40px rgba(239,68,68,0.45);

}

#status{

margin-top:28px;

text-align:center;

font-weight:700;

font-size:18px;

}

@media(max-width:700px){

.report-container{

}

</style>

</body>

</html>
