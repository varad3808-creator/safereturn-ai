<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Signup | SafeReturn</title>

<link
rel="stylesheet"
href="./style.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet">

</head>

<body>

<!-- GLOW -->

<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>

<!-- NAVBAR -->

<nav>

<div class="logo">

<i class="fa-solid fa-shield-heart"></i>

Safe<span>Return</span>

</div>

<div class="nav-links">

<a
href="./index.html"
class="nav-item">

<i class="fa-solid fa-house"></i>

Home

</a>

<a
href="./login.html"
class="nav-item">

<i class="fa-regular fa-user"></i>

Login

</a>

<a
href="./signup.html"
class="nav-item active-nav">

<i class="fa-solid fa-user-plus"></i>

Signup

</a>

<a
href="./profile.html"
class="nav-item">

<i class="fa-regular fa-circle-user"></i>

Profile

</a>

</div>

</nav>

<!-- SIGNUP -->

<section class="auth-page">

<div class="auth-box">

<div class="auth-icon">

<i class="fa-solid fa-shield-heart"></i>

</div>

<h1>

Create Account

</h1>

<p>

Create your SafeReturn account and help build a safer emergency response community.

</p>

<form id="signupForm">

<!-- NAME -->

<div class="modern-input">

<i class="fa-regular fa-user"></i>

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

</div>

<!-- EMAIL -->

<div class="modern-input">

<i class="fa-regular fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<!-- PASSWORD -->

<div class="modern-input">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Create a password"
required>

<i
class="fa-regular fa-eye password-toggle"
onclick="togglePassword('password',this)">

</i>

</div>

<!-- CONFIRM -->

<div class="modern-input">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
required>

<i
class="fa-regular fa-eye password-toggle"
onclick="togglePassword('confirmPassword',this)">

</i>

</div>

<!-- TERMS -->

<div class="remember-row">

<label>

<input
type="checkbox"
required>

I agree to the

<span>

Terms & Conditions

</span>

</label>

</div>

<!-- BUTTON -->

<button
type="submit"
class="modern-btn">

Create Account

</button>

<!-- DIVIDER -->

<div class="divider">

<span>or</span>

</div>

<!-- GOOGLE -->

<button
type="button"
id="googleSignup"
class="google-btn-modern">

<img
src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">

Continue With Google

</button>

<!-- LINKS -->

<div class="bottom-links">

Already have an account?

<a href="./login.html">

Login

</a>

</div>

<div class="bottom-links">

<a href="./index.html">

Back To Home

</a>

</div>

</form>

</div>

</section>

<script type="module">

import {

auth

}

from "./firebase.js";

import {

createUserWithEmailAndPassword,
updateProfile,
GoogleAuthProvider,
signInWithPopup

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

// =========================================
// SIGNUP
// =========================================

document.getElementById("signupForm")

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

// =========================================
// PASSWORD CHECK
// =========================================

if(password !== confirmPassword){

alert(

"Passwords do not match"

);

return;

}

try{

const userCredential =

await createUserWithEmailAndPassword(

auth,
email,
password

);

// =========================================
// PROFILE
// =========================================

await updateProfile(

userCredential.user,

{

displayName:name

}

);

alert(

"Account created successfully"

);

window.location.href =
"./profile.html";

}
catch(error){

alert(error.message);

}

}

);

// =========================================
// GOOGLE SIGNUP
// =========================================

document.getElementById("googleSignup")

.addEventListener(

"click",

async()=>{

try{

const provider =
new GoogleAuthProvider();

await signInWithPopup(

auth,
provider

);

window.location.href =
"./profile.html";

}
catch(error){

alert(error.message);

}

}

);

// =========================================
// PASSWORD TOGGLE
// =========================================

window.togglePassword = function(

id,
icon

){

const input =
document.getElementById(id);

if(input.type === "password"){

input.type = "text";

icon.classList.remove("fa-eye");

icon.classList.add("fa-eye-slash");

}
else{

input.type = "password";

icon.classList.remove("fa-eye-slash");

icon.classList.add("fa-eye");

}

};

</script>

</body>

</html>
