<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SafeReturn | Forgot Password</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

min-height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

background:
radial-gradient(circle at top,
#0b2d73 0%,
#02102f 45%,
#010814 100%);

position:relative;

}

/* =====================================
ANIMATED BACKGROUND
===================================== */

.glow{

position:absolute;

border-radius:50%;

filter:blur(90px);

animation:float 10s ease-in-out infinite;

}

.glow1{

width:340px;
height:340px;

background:#2563eb;

left:-120px;
top:-120px;

opacity:.45;

}

.glow2{

width:280px;
height:280px;

background:#06b6d4;

right:-100px;
bottom:-80px;

opacity:.35;

animation-delay:2s;

}

.glow3{

width:240px;
height:240px;

background:#7c3aed;

left:45%;
bottom:20%;

opacity:.25;

animation-delay:5s;

}

@keyframes float{

0%{

transform:translateY(0px);

}

50%{

transform:translateY(-35px);

}

100%{

transform:translateY(0px);

}

}

/* =====================================
PARTICLES
===================================== */

.particle{

position:absolute;

background:white;

border-radius:50%;

opacity:.15;

animation:particle 15s linear infinite;

}

@keyframes particle{

from{

transform:translateY(120vh);

}

to{

transform:translateY(-120vh);

}

}

/* =====================================
CARD
===================================== */

.card{

width:470px;

max-width:92%;

padding:45px;

background:

rgba(255,255,255,.08);

backdrop-filter:blur(25px);

border:

1px solid rgba(255,255,255,.15);

border-radius:32px;

box-shadow:

0 25px 60px rgba(0,0,0,.40);

z-index:5;

animation:fadeUp .8s;

position:relative;

overflow:hidden;

}

.card::before{

content:"";

position:absolute;

left:-40%;

top:-50%;

width:250px;
height:250px;

background:

radial-gradient(circle,
rgba(255,255,255,.18),
transparent);

transform:rotate(20deg);

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/* =====================================
LOGO
===================================== */

.logo{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-bottom:25px;

color:white;

}

.logo i{

font-size:42px;

color:#ef4444;

animation:pulse 2s infinite;

}

.logo h1{

font-size:42px;

font-weight:800;

}

.logo span{

color:#ef4444;

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

100%{

transform:scale(1);

}

}

/* =====================================
ICON
===================================== */

.icon-circle{

width:95px;
height:95px;

margin:auto;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:40px;

background:

linear-gradient(
135deg,
#2563eb,
#3b82f6);

color:white;

margin-bottom:25px;

box-shadow:

0 20px 45px rgba(37,99,235,.45);

animation:rotateGlow 6s linear infinite;

}

@keyframes rotateGlow{

0%{

transform:rotate(0deg);

}

100%{

transform:rotate(360deg);

}

}

h2{

text-align:center;

font-size:34px;

font-weight:700;

color:white;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#d1d5db;

line-height:1.8;

margin-bottom:35px;

font-size:15px;

}
/* =====================================
INPUT GROUP
===================================== */

.input-group{

position:relative;

margin-bottom:25px;

}

.input-group i{

position:absolute;

left:18px;

top:18px;

font-size:18px;

color:#94a3b8;

transition:.3s;

}

.input-group input{

width:100%;

padding:16px 18px 16px 55px;

border:none;

outline:none;

border-radius:18px;

background:

rgba(255,255,255,.10);

color:white;

font-size:16px;

transition:.35s;

}

.input-group input::placeholder{

color:#cbd5e1;

}

.input-group input:focus{

background:

rgba(255,255,255,.16);

box-shadow:

0 0 0 3px rgba(37,99,235,.35);

}

.input-group input:focus+i{

color:#3b82f6;

}

/* =====================================
BUTTON
===================================== */

button{

width:100%;

padding:17px;

border:none;

border-radius:18px;

background:

linear-gradient(
135deg,
#2563eb,
#3b82f6);

color:white;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:.35s;

box-shadow:

0 15px 35px rgba(37,99,235,.40);

}

button:hover{

transform:translateY(-4px);

box-shadow:

0 25px 45px rgba(37,99,235,.50);

}

button:disabled{

opacity:.7;

cursor:not-allowed;

}

/* =====================================
MESSAGE
===================================== */

.message-box{

margin-top:25px;

padding:18px;

border-radius:18px;

display:none;

opacity:0;

transform:translateY(15px);

transition:.4s;

text-align:center;

font-weight:600;

line-height:1.8;

}

.message-box.show{

display:block;

opacity:1;

transform:translateY(0);

}

.message-success{

background:

rgba(34,197,94,.15);

border:

1px solid rgba(34,197,94,.35);

color:#4ade80;

}

.message-error{

background:

rgba(239,68,68,.15);

border:

1px solid rgba(239,68,68,.35);

color:#f87171;

}

/* =====================================
BOTTOM LINKS
===================================== */

.bottom{

margin-top:30px;

display:flex;

justify-content:space-between;

flex-wrap:wrap;

gap:15px;

}

.bottom a{

text-decoration:none;

color:#60a5fa;

font-weight:600;

transition:.3s;

}

.bottom a:hover{

color:white;

}

/* =====================================
SECURITY
===================================== */

.security{

margin-top:35px;

display:flex;

justify-content:space-around;

text-align:center;

color:#cbd5e1;

font-size:13px;

}

.security div{

display:flex;

flex-direction:column;

align-items:center;

gap:8px;

}

.security i{

font-size:24px;

color:#3b82f6;

transition:.35s;

}

.security div:hover i{

transform:scale(1.2);

color:#60a5fa;

}

/* =====================================
FOOTER
===================================== */

.footer{

margin-top:35px;

text-align:center;

font-size:13px;

color:#94a3b8;

}

.footer span{

color:#3b82f6;

font-weight:700;

}

/* =====================================
VALIDATION
===================================== */

.valid{

box-shadow:

0 0 0 3px rgba(34,197,94,.35);

}

.invalid{

box-shadow:

0 0 0 3px rgba(239,68,68,.35);

}

/* =====================================
RESPONSIVE
===================================== */

@media(max-width:600px){

.card{

padding:30px;

width:92%;

}

.logo h1{

font-size:30px;

}

.icon-circle{

width:80px;

height:80px;

font-size:30px;

}

h2{

font-size:28px;

}

.subtitle{

font-size:14px;

}

.bottom{

flex-direction:column;

align-items:center;

}

.security{

flex-direction:column;

gap:20px;

}

}

/* =====================================
END CSS
===================================== */

</style>

</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div class="particle" style="left:10%;width:5px;height:5px;animation-delay:0s;"></div>
<div class="particle" style="left:25%;width:3px;height:3px;animation-delay:2s;"></div>
<div class="particle" style="left:40%;width:4px;height:4px;animation-delay:5s;"></div>
<div class="particle" style="left:55%;width:6px;height:6px;animation-delay:1s;"></div>
<div class="particle" style="left:70%;width:3px;height:3px;animation-delay:3s;"></div>
<div class="particle" style="left:85%;width:5px;height:5px;animation-delay:4s;"></div>

<div class="card">

<div class="logo">

<i class="fa-solid fa-shield-heart"></i>

<h1>

Safe<span>Return</span>

</h1>

</div>

<div class="icon-circle">

<i class="fa-solid fa-key"></i>

</div>

<h2>

Forgot Password?

</h2>

<p class="subtitle">

Enter your registered email address and we'll securely send you a password reset link.

</p>

<div class="input-group">

<input
type="email"
id="email"
placeholder="Enter your registered email">

<i class="fa-solid fa-envelope"></i>

</div>

<button id="resetBtn">

✨ Send Reset Link

</button>

<div
id="message"
class="message-box">

</div>

<div class="bottom">

<a href="login.html">

← Back to Login

</a>

<a href="index.html">

🏠 Home

</a>

</div>

<div class="security">

<div>

<i class="fa-solid fa-lock"></i>

<span>Secure</span>

</div>

<div>

<i class="fa-solid fa-bolt"></i>

<span>Fast</span>

</div>

<div>

<i class="fa-solid fa-shield-halved"></i>

<span>Protected</span>

</div>

</div>

<div class="footer">

Made with ❤️ by <span>SafeReturn</span>

</div>

</div>

<script type="module">
    // =========================================
// IMPORTS
// =========================================

import { auth } from "./firebase.js";

import {

sendPasswordResetEmail

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

// =========================================
// ELEMENTS
// =========================================

const email =
document.getElementById("email");

const resetBtn =
document.getElementById("resetBtn");

const message =
document.getElementById("message");

// =========================================
// SHOW SUCCESS
// =========================================

function showSuccess(text){

message.className=
"message-box message-success show";

message.innerHTML=

`
<i class="fa-solid fa-circle-check"
style="font-size:48px;margin-bottom:12px;"></i>

<br>

${text}
`;

}

// =========================================
// SHOW ERROR
// =========================================

function showError(text){

message.className=
"message-box message-error show";

message.innerHTML=

`
<i class="fa-solid fa-circle-xmark"
style="font-size:48px;margin-bottom:12px;"></i>

<br>

${text}
`;

}

// =========================================
// EMAIL VALIDATION
// =========================================

email.addEventListener("input",()=>{

email.value=email.value.trim().toLowerCase();

const regex=

/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(email.value===""){

email.classList.remove("valid","invalid");

return;

}

if(regex.test(email.value)){

email.classList.add("valid");

email.classList.remove("invalid");

}

else{

email.classList.add("invalid");

email.classList.remove("valid");

}

});

// =========================================
// BUTTON CLICK
// =========================================

resetBtn.addEventListener(

"click",

async()=>{

const userEmail=

email.value.trim().toLowerCase();

if(userEmail===""){

showError(

"Please enter your registered email."

);

return;

}

const regex=

/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!regex.test(userEmail)){

showError(

"Please enter a valid email address."

);

return;

}

resetBtn.disabled=true;

resetBtn.innerHTML=

`
<i class="fa-solid fa-spinner fa-spin"></i>

Sending...
`;

try{

await sendPasswordResetEmail(

auth,

userEmail

);

showSuccess(

`
<b>Password Reset Link Sent!</b>

<br><br>

Please check your inbox.

<br>

If you don't find it,

check your Spam folder.

<br><br>

Redirecting to Login in

<span id="count">5</span> seconds...
`

);

email.value="";

email.classList.remove("valid");

let seconds=5;

const timer=

setInterval(()=>{

seconds--;

const c=

document.getElementById("count");

if(c){

c.innerText=seconds;

}

if(seconds===0){

clearInterval(timer);

window.location.href=

"login.html";

}

},1000);

}

catch(error){

console.error(error);

switch(error.code){

case "auth/user-not-found":

showError(

"No account exists with this email."

);

break;

case "auth/invalid-email":

showError(

"The email address is invalid."

);

break;

case "auth/missing-email":

showError(

"Please enter your email."

);

break;

case "auth/network-request-failed":

showError(

"No internet connection."

);

break;

case "auth/too-many-requests":

showError(

"Too many attempts. Please try again later."

);

break;

default:

showError(

error.message

);

}

}

resetBtn.disabled=false;

resetBtn.innerHTML=

"✨ Send Reset Link";

}

);

</script>

</body>

</html>
